name: frontend-ci
on:
  push:
  schedule:
    - cron: "0 6 * * *"
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: core matches backend main
        run: |
          curl -fsSL https://raw.githubusercontent.com/ariandesu/starplus-backend/main/core/core.sha256 -o /tmp/backend-core.sha256
          diff core/core.sha256 /tmp/backend-core.sha256
